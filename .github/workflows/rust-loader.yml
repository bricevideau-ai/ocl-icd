name: Rust loader
on: [push, pull_request]

jobs:
  build-and-check:
    name: Build and Check (Rust loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure --enable-rust-loader --enable-official-khronos-headers
      - run: make
      # the upstream testsuite must pass against the Rust loader as well
      - run: make check
      # prove the binary really carries the Rust code (not silently the C one)
      - run: nm -D --defined-only .libs/libOpenCL.so.1.0.0 | grep -q "@@OPENCL_1.0"
      # Discriminating identity gate: run a probe through the built lib
      # and require the Rust loader's stderr banner. The D_LOG lines exist
      # verbatim in the C loader too but printed as "ocl-icd(file:line):
      # func:", so a "ocl-icd-rs:" hit proves the Rust code served the
      # call. (nm/strings gates are NOT discriminating: C exports the same
      # symbols, and a binary-searchable literal proves presence of code,
      # not that it was linked as the loader.)
      - run: |
          lib=$(pwd)/.libs/libOpenCL.so.1.0.0
          cat > probe.c.in <<'EOF'
          /* dlopen by ABSOLUTE path: no SONAME/ld.so ambiguity about which loader
             served the call. dlsym of the Rust-only test hook discriminates Rust
             from C by symbol existence, which is binary, not stderr formatting. */
          #include <stdio.h>
          #include <dlfcn.h>
          int main(void) {
            void *h = dlopen("__TARGET_LIB__", RTLD_NOW);
            if (!h) { fprintf(stderr, "DLOPEN FAIL: %s\n", dlerror()); return 2; }
            if (!dlsym(h, "ocl_icd_rs_test_has_unloadable")) { fprintf(stderr, "NOT THE RUST LOADER\n"); return 3; }
            int (*gpi)(unsigned, void **, unsigned *) = dlsym(h, "clGetPlatformIDs");
            if (!gpi) return 4;
            unsigned n = 0;
            int e = gpi(0, 0, &n);
            fprintf(stderr, "loader answered: err=%d platforms=%u\n", e, n);
            return 0;
          }
          EOF
          sed "s|__TARGET_LIB__|$lib|" probe.c.in > probe.c
          gcc probe.c -o probe -ldl
          ./probe 2>err.log; rc=$?
          cat err.log
          test $rc -eq 0 || { echo "gate failed rc=$rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-loader-testsuite
          path: |
            tests/testsuite.log

  build-and-check-macos:
    name: Build and Check (Rust loader, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install automake libtool
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure --enable-rust-loader --enable-official-khronos-headers
      - run: make
      - run: make check
      # Discriminating identity gate (see Linux job): the "ocl-icd-rs:"
      # banner exists only in the Rust code; the C loader prints the same
      # messages as "ocl-icd(...)".
      - run: |
          lib=$(pwd)/$(find .libs -name 'libOpenCL*.dylib' -type f | head -1)
          cat > probe.c.in <<'EOF'
          /* dlopen by ABSOLUTE path: no SONAME/ld.so ambiguity about which loader
             served the call. dlsym of the Rust-only test hook discriminates Rust
             from C by symbol existence, which is binary, not stderr formatting. */
          #include <stdio.h>
          #include <dlfcn.h>
          int main(void) {
            void *h = dlopen("__TARGET_LIB__", RTLD_NOW);
            if (!h) { fprintf(stderr, "DLOPEN FAIL: %s\n", dlerror()); return 2; }
            if (!dlsym(h, "ocl_icd_rs_test_has_unloadable")) { fprintf(stderr, "NOT THE RUST LOADER\n"); return 3; }
            int (*gpi)(unsigned, void **, unsigned *) = dlsym(h, "clGetPlatformIDs");
            if (!gpi) return 4;
            unsigned n = 0;
            int e = gpi(0, 0, &n);
            fprintf(stderr, "loader answered: err=%d platforms=%u\n", e, n);
            return 0;
          }
          EOF
          sed "s|__TARGET_LIB__|$lib|" probe.c.in > probe.c
          gcc probe.c -o probe -ldl
          ./probe 2>err.log; rc=$?
          cat err.log
          test $rc -eq 0 || { echo "gate failed rc=$rc"; exit 1; }

  distcheck:
    name: Distcheck (Rust loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure
      # VPATH build: exercises rust/build-loader.sh out-of-tree materialisation
      - run: make distcheck DISTCHECK_CONFIGURE_FLAGS="--enable-rust-loader"
