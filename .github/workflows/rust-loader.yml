name: Rust loader
on: [push, pull_request]

jobs:
  build-and-check:
    name: Build and Check (Rust loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure --enable-rust-loader --enable-official-khronos-headers
      - run: make
      # the upstream testsuite must pass against the Rust loader as well
      - run: make check
      # ABI gate: the C map's version nodes must be present...
      - run: nm -D --defined-only .libs/libOpenCL.so.1.0.0 | grep -q "@@OPENCL_1.0"
      # ...and IDENTITY gate: the dynsym must carry the test hook that ONLY
      # the Rust crate defines. C can never pass this, and a silently-C
      # build fails it -- which is exactly the bug it caught on macOS
      # (configure.ac force-disabled the flag there; see the fix). Symbol
      # presence in the built FILE is the whole proof; make check has
      # already shown the library works.
      - run: nm -D --defined-only .libs/libOpenCL.so.1.0.0 | grep -q "ocl_icd_rs_test_has_unloadable@@OPENCL_RUST"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-loader-testsuite
          path: |
            tests/testsuite.log

  build-and-check-macos:
    name: Build and Check (Rust loader, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install automake libtool
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure --enable-rust-loader --enable-official-khronos-headers
      - run: make
      - run: make check
      # macOS has no version scripts (for either loader): gate on the
      # unversioned hook symbol plus an export-count sanity check.
      - run: |
          lib=$(find .libs -name 'libOpenCL*.dylib' -type f | head -1)
          echo "$lib: $(nm -gU "$lib" | grep -c ' _cl') cl* exports"
          nm -gU "$lib" | grep -q _ocl_icd_rs_test_has_unloadable

  distcheck:
    name: Distcheck (Rust loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./bootstrap
      - run: ./configure
      # VPATH build: exercises rust/build-loader.sh out-of-tree materialisation
      - run: make distcheck DISTCHECK_CONFIGURE_FLAGS="--enable-rust-loader"
