[workspace]
resolver = "2"

[package]
name = "ocl-icd-rs"
version = "2.3.5"
edition = "2021"
description = "Rust port of the ocl-icd OpenCL ICD loader"
license = "BSD-2-Clause"

[lib]
crate-type = ["cdylib"]

# Zero dependencies, cargo build included: the small libc surface used
# (dlopen family) is declared directly in src/clib.rs, and the slot tables
# are generated before cargo runs by:
#   ruby icd_generator.rb --mode rust-generate   (see rust/build-loader.sh)
# so libOpenCL.so ships no third-party code and crates.io is never consulted.

[profile.release]
debug = 2
